# Where each file in assets/ and vendor/ came from, one entry per file. The field names are the
# provenance record's, so the entries carry over when the game grows.
# - path: assets/hit.wav      # relative to this game's folder
#   origin: ai                # ai | bought | cc0 | you | outsourced | template | plugin | licensed | code | unknown
#   tool: "what made or fetched it: the generator, or the script for code"
#   model: "the model ID, when a model made it or an AI wrote its code"
#   source: {vendor: "who made or sold it", product: "its name", url: "where from"}   # a download
#   licence: {id: CC0-1.0}    # a download: the SPDX id where one exists
#   date: 2026-01-31
#   ships: true               # false for a file only the build uses
#   placeholder: true         # until it is replaced; leave the line out otherwise
- path: assets/fonts/pixel-latin.woff2
  origin: licensed
  tool: "copied from this repo's src/pixel/fonts/pixel-latin.woff2 (scripts/pixel/font.sh: a subset of Galmuri11, renamed Zendikar Pixel)"
  source: {vendor: "Lee Minseo (quiple)", product: "Galmuri11 2.40.3, Latin subset", url: "https://github.com/quiple/galmuri"}
  licence: {id: OFL-1.1}
  date: 2026-11-10
  ships: true
- path: assets/fonts/pixel-hangul.woff2
  origin: licensed
  tool: "copied from this repo's src/pixel/fonts/pixel-hangul.woff2 (scripts/pixel/font.sh: a subset of Galmuri11, renamed Zendikar Pixel)"
  source: {vendor: "Lee Minseo (quiple)", product: "Galmuri11 2.40.3, Hangul subset", url: "https://github.com/quiple/galmuri"}
  licence: {id: OFL-1.1}
  date: 2026-11-10
  ships: true
- path: assets/fonts/OFL.txt
  origin: licensed
  tool: "copied from this repo's src/pixel/fonts/OFL.txt: the fonts' licence text, shipped with them"
  source: {vendor: "Lee Minseo (quiple)", product: "Galmuri11 2.40.3 licence", url: "https://github.com/quiple/galmuri"}
  licence: {id: OFL-1.1}
  date: 2026-11-10
  ships: true
